<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caminho para o Céu - Zelda RPG Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 4px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            background: #222;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        /* HUD Superior */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid #d4af37;
            font-size: 14px;
            z-index: 10;
        }
        .stat-bar {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .bar-container {
            width: 100px;
            height: 10px;
            background: #444;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #777;
        }
        #faith-fill {
            width: 100%;
            height: 100%;
            background: #4caf50;
            transition: width 0.3s;
        }
        /* Botões de Acesso (Mapa) */
        #menu-buttons {
            position: absolute;
            bottom: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .game-btn {
            background: #8b0000;
            color: #ffd700;
            border: 2px solid #ffd700;
            padding: 8px 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .game-btn:hover {
            background: #a52a2a;
            transform: scale(1.05);
        }
        /* Modal do Mapa Global */
        #map-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 500px;
            background: rgba(20, 20, 20, 0.95);
            border: 4px solid #ffd700;
            border-radius: 10px;
            z-index: 100;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            text-align: center;
        }
        #map-modal h2 {
            color: #ffd700;
            margin-top: 0;
            font-family: serif;
            letter-spacing: 2px;
        }
        #world-map-img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border: 2px solid #d4af37;
            border-radius: 5px;
        }
        .close-btn {
            margin-top: 10px;
            background: #333;
            color: #fff;
            border: 1px solid #ffd700;
            padding: 5px 15px;
            cursor: pointer;
            border-radius: 4px;
        }
        .close-btn:hover {
            background: #555;
        }
        /* Mensagens de Notificação / Diálogo */
        #dialog-box {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #ffd700;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            z-index: 20;
            font-size: 15px;
            color: #fff;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- HUD do Personagem -->
    <div id="hud">
        <div class="stat-bar">
            <span>🙏 Fé:</span>
            <div class="bar-container"><div id="faith-fill"></div></div>
        </div>
        <div>📖 Bíblias: <span id="bible-count">0</span>/3</div>
        <div>🪙 moedas (Assembleia): <span id="coin-count">0</span></div>
    </div>

    <!-- Tela do Jogo (Canvas) -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- Botões Inferiores -->
    <div id="menu-buttons">
        <button class="game-btn" onclick="toggleMap()">🗺️ Abrir Mapa</button>
    </div>

    <!-- Caixa de Mensagens / Eventos -->
    <div id="dialog-box" id="dialogText">Pressione as setas ou W, A, S, D para se mover. Colete Bíblias e Moedas!</div>

    <!-- Modal do Mapa Global (Foto 1) -->
    <div id="map-modal">
        <h2>MAPA DE MELUNA (MUNDO)</h2>
        <!-- Utilizando representação limpa do mapa global baseado na ref 1 -->
        <div style="background: url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=700&q=80') center/cover; width: 100%; height: 380px; border-radius: 5px; border: 2px solid #ffd700; display:flex; align-items:center; justify-content:center;">
            <div style="background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; border: 1px solid #ffd700;">
                <p style="color: #ffd700; margin:0 0 5px 0; font-weight:bold;">📍 Localização Atual: Vila Assembleia de Deus (Illyria)</p>
                <p style="font-size: 13px; margin:0; color:#ddd;">Atravesse as estradas, colete a Palavra e prepare-se para a jornada final.</p>
            </div>
        </div>
        <button class="close-btn" onclick="toggleMap()">Fechar Mapa</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Configuração do Jogador (Daniel / Jovem Escolhido)
    let player = {
        x: 400,
        y: 300,
        size: 24,
        speed: 3,
        color: '#3498db',
        faith: 100,
        bibles: 0,
        coins: 0
    };

    // Teclas pressionadas
    let keys = {};
    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    // Itens Colecionáveis no mapa (Bíblias e Moedas inspiradas nas referências)
    let items = [
        { x: 250, y: 150, type: 'bible', collected: false, label: '📖' },
        { x: 600, y: 400, type: 'bible', collected: false, label: '📖' },
        { x: 150, y: 480, type: 'bible', collected: false, label: '📖' },
        { x: 350, y: 250, type: 'coin', collected: false, label: '🪙' },
        { x: 500, y: 200, type: 'coin', collected: false, label: '🪙' },
        { x: 300, y: 400, type: 'coin', collected: false, label: '🪙' },
        { x: 650, y: 150, type: 'coin', collected: false, label: '🪙' }
    ];

    // Casas e Templos estruturados no estilo Map Maker (Ref 4 e 5)
    let buildings = [
        { x: 100, y: 80, w: 120, h: 90, color: '#8b4513', name: 'Templo Central' },
        { x: 550, y: 80, w: 140, h: 100, color: '#a0522d', name: 'Comunidade Cristã' },
        { x: 100, y: 420, w: 130, h: 90, color: '#cd853f', name: 'Casa de Oração' },
        { x: 550, y: 420, w: 130, h: 90, color: '#d2691e', name: 'Refúgio Espiritual' }
    ];

    // Estradas jogáveis baseadas no Map Maker
    let roads = [
        { x: 80, y: 200, w: 640, h: 40 }, // Horizontal Principal
        { x: 360, y: 60, w: 40, h: 480 }   // Vertical Principal
    ];

    let mapOpen = false;

    function toggleMap() {
        mapOpen = !mapOpen;
        document.getElementById('map-modal').style.display = mapOpen ? 'block' : 'none';
    }

    function showMessage(text) {
        const box = document.getElementById('dialog-box');
        box.innerText = text;
        box.style.display = 'block';
        setTimeout(() => {
            box.style.display = 'none';
        }, 3000);
    }

    // Atualização da Lógica do Jogo
    function update() {
        if (mapOpen) return;

        // Movimentação estilo Zelda RPG (Suave com Suporte a W, A, S, D e Setas)
        let dx = 0;
        let dy = 0;

        if (keys['arrowup'] || keys['w']) dy -= player.speed;
        if (keys['arrowdown'] || keys['s']) dy += player.speed;
        if (keys['arrowleft'] || keys['a']) dx -= player.speed;
        if (keys['arrowright'] || keys['d']) dx += player.speed;

        player.x += dx;
        player.y += dy;

        // Limites do mundo do mapa
        if (player.x < 40) player.x = 40;
        if (player.x > canvas.width - 40) player.x = canvas.width - 40;
        if (player.y < 40) player.y = 40;
        if (player.y > canvas.height - 40) player.y = canvas.height - 40;

        // Colisão com itens (Bíblias e Moedas)
        items.forEach(item => {
            if (!item.collected) {
                let dist = Math.hypot(player.x - item.x, player.y - item.y);
                if (dist < 25) {
                    item.collected = true;
                    if (item.type === 'bible') {
                        player.bibles++;
                        player.faith = Math.min(100, player.faith + 15);
                        document.getElementById('bible-count').innerText = player.bibles;
                        showMessage("📖 Você encontrou a Palavra! Sua Fé aumentou.");
                    } else if (item.type === 'coin') {
                        player.coins++;
                        document.getElementById('coin-count').innerText = player.coins;
                        showMessage("🪙 Você coletou uma oferta/moeda da Assembleia!");
                    }
                }
            }
        });

        // Atualizar Barra de Fé no HUD
        document.getElementById('faith-fill').style.width = player.faith + '%';
    }

    // Renderização Gráfica Estilo Pixel/RPG Clássico
    function draw() {
        // Limpar tela (Fundo de Grama verde estilo Map Maker)
        ctx.fillStyle = '#2d6a4f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Desenhar Estradas Jogáveis (Caminhos de pedra/terra)
        ctx.fillStyle = '#b08968';
        roads.forEach(r => {
            ctx.fillRect(r.x, r.y, r.w, r.h);
            ctx.strokeStyle = '#7f5539';
            ctx.lineWidth = 2;
            ctx.strokeRect(r.x, r.y, r.w, r.h);
        });

        // Desenhar Construções / Templos / Casas estilo Zelda/RPG Maker
        buildings.forEach(b => {
            ctx.fillStyle = b.color;
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2;
            ctx.strokeRect(b.x, b.y, b.w, b.h);

            // Teto/Detalhe
            ctx.fillStyle = '#582f0e';
            ctx.fillRect(b.x - 5, b.y - 15, b.w + 10, 20);

            // Nome da construção no mapa
            ctx.fillStyle = '#fff';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(b.name, b.x + b.w / 2, b.y + b.h / 2);
        });

        // Desenhar Itens (Bíblias e Moedas)
        items.forEach(item => {
            if (!item.collected) {
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(item.label, item.x, item.y + 7);
            }
        });

        // Desenhar Jogador (Personagem com visual clássico RPG / Túnica)
        ctx.fillStyle = '#e76f51'; // Corpo / Túnica
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Rosto do Jogador (Detalhe simples)
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('👤 Daniel', player.x, player.y - 18);
    }

    // Loop Principal do Jogo
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // Iniciar o jogo
    gameLoop();
</script>

</body>
</html>
