<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caminho para o Céu - RPG 2012 Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0f;
            color: #f0f0f0;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: #1a2e1a;
            border: 4px solid #b8860b;
            box-shadow: 0 0 25px rgba(184, 134, 11, 0.6);
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #284c28;
        }
        /* HUD Superior Estilo RPG 2012 */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.6));
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #d4af37;
            z-index: 10;
            font-size: 13px;
        }
        .stat-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .bar-bg {
            width: 90px;
            height: 10px;
            background: #333;
            border: 1px solid #777;
            border-radius: 3px;
            overflow: hidden;
        }
        #faith-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            transition: width 0.3s ease;
        }
        /* Botões de Ação na Tela */
        #menu-buttons {
            position: absolute;
            top: 70px;
            right: 15px;
            z-index: 10;
        }
        .rpg-btn {
            background: linear-gradient(to bottom, #8b0000, #5c0000);
            color: #ffd700;
            border: 2px solid #ffd700;
            padding: 8px 14px;
            font-weight: bold;
            font-family: serif;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            font-size: 12px;
        }
        .rpg-btn:active {
            transform: scale(0.95);
        }
        /* Controlos D-Pad Virtuais para Telemóvel */
        #touch-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            height: 150px;
            z-index: 15;
            pointer-events: none;
        }
        .dpad-btn {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(40, 40, 40, 0.75);
            border: 2px solid #d4af37;
            border-radius: 50%;
            color: #ffd700;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        #btn-up { bottom: 75px; left: 85px; }
        #btn-down { bottom: 5px; left: 85px; }
        #btn-left { bottom: 40px; left: 20px; }
        #btn-right { bottom: 40px; left: 150px; }

        /* Caixa de Diálogo Estilo RPG clássico */
        #dialog-box {
            display: none;
            position: absolute;
            bottom: 175px;
            left: 15px;
            right: 15px;
            background: rgba(15, 15, 25, 0.92);
            border: 3px solid #d4af37;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            z-index: 20;
            font-size: 14px;
            color: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
        /* Modal do Mapa Estilizado */
        #map-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 420px;
            background: #181820;
            border: 4px solid #d4af37;
            border-radius: 12px;
            z-index: 100;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }
        #map-modal h2 {
            color: #ffd700;
            margin-top: 0;
            font-size: 18px;
        }
        .map-screen-bg {
            width: 100%;
            height: 260px;
            background: url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=600&q=80') center/cover;
            border: 2px solid #b8860b;
            border-radius: 6px;
            display: flex;
            align-items: flex-end;
            padding: 10px;
        }
        .map-info-card {
            background: rgba(0, 0, 0, 0.85);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ffd700;
            width: 100%;
            font-size: 11px;
            text-align: left;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- HUD Superior -->
    <div id="hud">
        <div class="stat-group">
            <span>🙏 Fé & Espírito</span>
            <div class="bar-bg"><div id="faith-bar"></div></div>
        </div>
        <div>📖 Bíblias: <span id="bible-count">0</span>/3</div>
        <div>🪙 Moedas: <span id="coin-count">0</span></div>
    </div>

    <!-- Botão do Mapa -->
    <div id="menu-buttons">
        <button class="rpg-btn" onclick="toggleMap()">🗺️ MAPA MUNDI</button>
    </div>

    <!-- Canvas do Jogo -->
    <canvas id="gameCanvas" width="480" height="800"></canvas>

    <!-- Caixa de Diálogo -->
    <div id="dialog-box">Mensagem do jogo...</div>

    <!-- Controlos Virtuais para Telemóvel -->
    <div id="touch-controls">
        <div class="dpad-btn" id="btn-up" ontouchstart="setKey('w', true)" ontouchend="setKey('w', false)" onmousedown="setKey('w', true)" onmouseup="setKey('w', false)">▲</div>
        <div class="dpad-btn" id="btn-down" ontouchstart="setKey('s', true)" ontouchend="setKey('s', false)" onmousedown="setKey('s', true)" onmouseup="setKey('s', false)">▼</div>
        <div class="dpad-btn" id="btn-left" ontouchstart="setKey('a', true)" ontouchend="setKey('a', false)" onmousedown="setKey('a', true)" onmouseup="setKey('a', false)">◀</div>
        <div class="dpad-btn" id="btn-right" ontouchstart="setKey('d', true)" ontouchend="setKey('d', false)" onmousedown="setKey('d', true)" onmouseup="setKey('d', false)">▶</div>
    </div>

    <!-- Modal do Mapa Global -->
    <div id="map-modal">
        <h2>ATLAS DE MELUNA & PORTUGAL</h2>
        <div class="map-screen-bg">
            <div class="map-info-card">
                <span style="color: #ffd700; font-weight: bold;">📍 Vila Assembleia de Deus (Illyria)</span><br>
                "Ouve, filho meu, a instrução de teu pai..." (Provérbios 1:8)
            </div>
        </div>
        <button class="rpg-btn" style="margin-top: 12px; width: 100%;" onclick="toggleMap()">Fechar Mapa</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Ajustar dimensões do canvas à tela
    canvas.width = 480;
    canvas.height = 800;

    // Estado do Jogador (Daniel)
    let player = {
        x: 240,
        y: 400,
        size: 28,
        speed: 3.5,
        faith: 100,
        bibles: 0,
        coins: 0,
        direction: 'down'
    };

    let keys = {};
    function setKey(k, isDown) {
        keys[k] = isDown;
    }

    // Teclado físico suporte
    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    // Itens Colecionáveis refinados com visual de RPG 2012
    let items = [
        { x: 100, y: 150, type: 'bible', collected: false, label: '📖' },
        { x: 380, y: 250, type: 'bible', collected: false, label: '📖' },
        { x: 240, y: 650, type: 'bible', collected: false, label: '📖' },
        { x: 120, y: 450, type: 'coin', collected: false, label: '🪙' },
        { x: 350, y: 500, type: 'coin', collected: false, label: '🪙' },
        { x: 200, y: 280, type: 'coin', collected: false, label: '🪙' }
    ];

    // Edifícios detalhados (Estilo RPG Maker 2012 com telhados texturizados e sombras)
    let buildings = [
        { x: 40, y: 80, w: 160, h: 110, name: 'Templo Central' },
        { x: 280, y: 80, w: 160, h: 110, name: 'Comunidade Cristã' },
        { x: 40, y: 560, w: 160, h: 110, name: 'Casa de Oração' },
        { x: 280, y: 560, w: 160, h: 110, name: 'Refúgio Espiritual' }
    ];

    // Estradas de paralelepípedo/terra batida (Map Maker)
    let roads = [
        { x: 0, y: 360, w: 480, h: 80 }, // Estrada Horizontal
        { x: 200, y: 0, w: 80, h: 800 }   // Estrada Vertical
    ];

    let mapOpen = false;

    function toggleMap() {
        mapOpen = !mapOpen;
        document.getElementById('map-modal').style.display = mapOpen ? 'block' : 'none';
    }

    function showMessage(text) {
        const box = document.getElementById('dialog-box');
        box.innerText = text;
        box.style.display = 'block';
        setTimeout(() => {
            box.style.display = 'none';
        }, 2800);
    }

    function update() {
        if (mapOpen) return;

        let dx = 0;
        let dy = 0;

        if (keys['arrowup'] || keys['w']) { dy -= player.speed; player.direction = 'up'; }
        if (keys['arrowdown'] || keys['s']) { dy += player.speed; player.direction = 'down'; }
        if (keys['arrowleft'] || keys['a']) { dx -= player.speed; player.direction = 'left'; }
        if (keys['arrowright'] || keys['d']) { dx += player.speed; player.direction = 'right'; }

        player.x += dx;
        player.y += dy;

        // Limites do mundo do mapa
        if (player.x < 30) player.x = 30;
        if (player.x > canvas.width - 30) player.x = canvas.width - 30;
        if (player.y < 30) player.y = 30;
        if (player.y > canvas.height - 30) player.y = canvas.height - 30;

        // Colisões com itens
        items.forEach(item => {
            if (!item.collected) {
                let dist = Math.hypot(player.x - item.x, player.y - item.y);
                if (dist < 30) {
                    item.collected = true;
                    if (item.type === 'bible') {
                        player.bibles++;
                        player.faith = Math.min(100, player.faith + 20);
                        document.getElementById('bible-count').innerText = player.bibles;
                        showMessage("📖 Encontrou as Escrituras Sagradas! Fé restaurada.");
                    } else if (item.type === 'coin') {
                        player.coins++;
                        document.getElementById('coin-count').innerText = player.coins;
                        showMessage("🪙 Recolheu uma oferta da Assembleia de Deus!");
                    }
                }
            }
        });

        document.getElementById('faith-bar').style.width = player.faith + '%';
    }

    function draw() {
        // Fundo Relva texturizada
        ctx.fillStyle = '#224222';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Desenhar estradas com detalhe estilo Map Maker (pedra/terra batida)
        ctx.fillStyle = '#b08968';
        roads.forEach(r => {
            ctx.fillRect(r.x, r.y, r.w, r.h);
            ctx.strokeStyle = '#7c5235';
            ctx.lineWidth = 3;
            ctx.strokeRect(r.x, r.y, r.w, r.h);
        });

        // Desenhar Edifícios / Templos com aspeto profissional 2012 (paredes texturizadas e telhado inclinado)
        buildings.forEach(b => {
            // Sombra do edifício
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(b.x + 6, b.y + 6, b.w, b.h);

            // Corpo da Casa / Templo (Paredes de madeira/pedra nobre)
            ctx.fillStyle = '#d29054';
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.strokeStyle = '#4a2810';
            ctx.lineWidth = 2;
            ctx.strokeRect(b.x, b.y, b.w, b.h);

            // Telhado Estilo RPG Maker (Vermelho/Castanho com relevo)
            ctx.fillStyle = '#8b2500';
            ctx.beginPath();
            ctx.moveTo(b.x - 10, b.y);
            ctx.lineTo(b.x + b.w / 2, b.y - 30);
            ctx.lineTo(b.x + b.w + 10, b.y);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#ffd700';
            ctx.stroke();

            // Placa / Nome do Edifício
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(b.x + 10, b.y + b.h / 2 - 12, b.w - 20, 24);
            ctx.strokeStyle = '#d4af37';
            ctx.strokeRect(b.x + 10, b.y + b.h / 2 - 12, b.w - 20, 24);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 11px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.fillText(b.name, b.x + b.w / 2, b.y + b.h / 2 + 4);
        });

        // Desenhar Itens (Bíblias e Moedas em alta nitidez)
        items.forEach(item => {
            if (!item.collected) {
                ctx.font = '24px serif';
                ctx.textAlign = 'center';
                ctx.fillText(item.label, item.x, item.y + 8);
            }
        });

        // Desenhar Personagem Principal (Daniel) com detalhe visual estilo Sprite RPG 2012
        // Sombra debaixo do personagem
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.arc(player.x, player.y + 12, 10, 0, Math.PI * 2);
        ctx.fill();

        // Túnica / Corpo
        ctx.fillStyle = '#2980b9';
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Detalhe de Cabeça / Rosto
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(player.x, player.y - 4, 8, 0, Math.PI * 2);
        ctx.fill();

        // Nome do Jogador acima da cabeça
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Daniel', player.x, player.y - 20);
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
